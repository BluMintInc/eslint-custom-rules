on:
  pull_request:
  push:

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write
  checks: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-test:
    name: Build & Test
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run test:ci

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: JEST Tests
          path: reports/jest-*.xml
          reporter: jest-junit

      # Placed after the test report so a docs mismatch cannot suppress the jest
      # results, and run on failure too so one CI round surfaces both a test
      # regression and docs drift rather than one at a time. `npm ci` builds
      # lib/ via the prepare script, which is what eslint-doc-generator reads.
      # Only the docs check is green today — do not add `lint:js` here, it
      # carries ~434 pre-existing errors.
      - name: Docs metadata check
        if: success() || failure()
        run: npm run lint:eslint-docs
